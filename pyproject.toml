[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solubility-public-data"
version = "0.1.0"
description = "Reproducible mini-protein insolubility models and public benchmark data"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "scipy>=1.11,<2", "biopython>=1.83,<2", "openpyxl>=3.1,<4", "xlsxwriter>=3.2,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
esm = ["transformers==4.56.1", "safetensors>=0.4"]
dev = ["pytest>=8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "build>=1"]

[project.scripts]
solubility = "solubility_public_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
